# Nem os serviços fixam `container_name`, nem a rede fixa `name`: os dois
# impediriam rodar uma segunda instância no mesmo servidor — e o nome de rede
# fixo é pior que impedir, porque as instâncias se enxergariam e `postgres`
# resolveria para o banco errado. Com o compose nomeando por projeto,
# `-p homologacao` sobe um ambiente inteiro e isolado ao lado.
services:
  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    command:
      - --providers.file.directory=/etc/traefik/dinamico
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
    ports:
      # 80/443 podem estar ocupadas por outro stack na mesma máquina —
      # em dev usamos 8081/8443. Produção sobrescreve para 80/443 no overlay.
      - "${TRAEFIK_HTTP_PORT:-8081}:80"
      - "${TRAEFIK_HTTPS_PORT:-8443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8090}:8080"
    volumes:
      - ./traefik/dinamico:/etc/traefik/dinamico:ro
      - ./traefik/certificados:/etc/traefik/certificados:ro
      - ./volumes/letsencrypt:/letsencrypt
    networks: [engorda]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-America/Sao_Paulo}
      PGTZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [engorda]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [engorda]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./volumes/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [engorda]

  # Cria o bucket de áudios de observação uma vez e sai.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET} &&
      echo 'bucket ${MINIO_BUCKET} pronto'
      "
    networks: [engorda]

  backend:
    build:
      context: ./backend
      # "dev" traz também as ferramentas de teste; em produção use "api".
      args:
        PERFIL: ${PERFIL_BACKEND:-dev}
    restart: unless-stopped
    user: "${UID_HOST:-1000}:${GID_HOST:-1000}"
    # --proxy-headers faz o uvicorn ler X-Forwarded-Proto: sem isso, atrás de
    # um proxy que termina o TLS, a aplicação acha que tudo chegou por http.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --proxy-headers --forwarded-allow-ips ${PROXIES_CONFIAVEIS:-*}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      LOG_LEVEL: ${LOG_LEVEL}
      AMBIENTE: ${AMBIENTE:-desenvolvimento}
      CORS_ORIGENS: ${CORS_ORIGENS:-*}
      MIGRAR_AO_SUBIR: ${MIGRAR_AO_SUBIR:-1}
      PROXIES_CONFIAVEIS: ${PROXIES_CONFIAVEIS:-*}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [engorda]

  worker:
    build:
      context: ./backend
      args:
        PERFIL: worker
    restart: unless-stopped
    user: "${UID_HOST:-1000}:${GID_HOST:-1000}"
    command: arq app.worker.WorkerSettings
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      SECRET_KEY: ${SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL}
      TRANSCRICAO_API_URL: ${TRANSCRICAO_API_URL}
      TRANSCRICAO_API_CHAVE: ${TRANSCRICAO_API_CHAVE}
      TRANSCRICAO_API_MODELO: ${TRANSCRICAO_API_MODELO}
      WHISPER_MODELO_LOCAL: ${WHISPER_MODELO_LOCAL}
      # Cache do modelo do Whisper: sem isso ele é rebaixado a cada recriação do
      # container, e o download acontece justamente quando a rede já falhou.
      HF_HOME: /modelos
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./backend:/app
      - ./volumes/modelos:/modelos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [engorda]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      WATCHPACK_POLLING: "true"
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks: [engorda]

networks:
  # Sem `name:` fixo de propósito. Com um nome fixo, duas instâncias no mesmo
  # servidor entram na MESMA rede e `postgres` passa a resolver para qualquer um
  # dos dois bancos — uma instalação de homologação falaria com o banco de
  # produção sem avisar ninguém. Assim o compose prefixa a rede por projeto.
  engorda:
