# Overlay de produção (M9): HTTPS via Let's Encrypt e redirecionamento de http→https.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  traefik:
    command:
      - --providers.file.directory=/etc/traefik/dinamico
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      # Atrás de OUTRO proxy (Nginx Proxy Manager, Cloudflare), o Traefik
      # precisa confiar nos cabeçalhos que ele repassa — senão sobrescreve o
      # esquema e o IP do cliente com os do proxy da frente.
      - --entrypoints.web.forwardedHeaders.trustedIPs=${IPS_DO_PROXY:-127.0.0.1/32,172.16.0.0/12}
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=${IPS_DO_PROXY:-127.0.0.1/32,172.16.0.0/12}
      - --log.level=INFO
    volumes:
      - ./traefik/dinamico-prod:/etc/traefik/dinamico:ro
      - ./volumes/letsencrypt:/letsencrypt
    ports:
      - "80:80"
      - "443:443"

  backend:
    environment:
      # Liga as verificações de subida: a aplicação recusa começar com segredo
      # de exemplo, e a documentação interativa some.
      AMBIENTE: producao
    # Sem as ferramentas de teste nem as bibliotecas de transcrição.
    build:
      context: ./backend
      args:
        PERFIL: api
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips ${PROXIES_CONFIAVEIS:-*}

  frontend:
    command: sh -c "npm run build && npm run start"
