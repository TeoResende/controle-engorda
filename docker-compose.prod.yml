# Overlay de produção (M9): HTTPS via Let's Encrypt e redirecionamento de http→https.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  traefik:
    command:
      - --providers.file.directory=/etc/traefik/dinamico
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
    volumes:
      - ./traefik/dinamico-prod:/etc/traefik/dinamico:ro
      - ./volumes/letsencrypt:/letsencrypt
    ports:
      - "80:80"
      - "443:443"

  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    command: sh -c "npm run build && npm run start"
