# Certificado de desenvolvimento para a rede local, assinado por uma autoridade
# própria (`ca.crt`).
#
# Autoassinado puro não serve: o Chrome **recusa registrar Service Worker** em
# página com erro de certificado, mesmo depois de a pessoa clicar em "continuar
# assim mesmo" — o aviso some da tela, mas a origem segue marcada como insegura
# por baixo, e o app nunca funciona offline. Com uma CA instalada como confiável
# no aparelho não há erro nenhum, e tudo passa a funcionar.
#
# Gerar de novo (troca de IP, validade vencida): ./traefik/gerar-certificados.sh
#
# Não é firula: Service Worker, PWA instalável e Web NFC só funcionam em
# contexto seguro. Sem HTTPS, o M5 e o M6 não são testáveis no celular de
# verdade — só no localhost da máquina de desenvolvimento.
#
# O navegador vai avisar que o certificado não é confiável; aceitar a exceção
# uma vez basta, e a origem passa a valer como segura. Em produção (M9) quem
# emite é o Let's Encrypt, e este arquivo não é usado.
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certificados/cadeia.crt
        keyFile: /etc/traefik/certificados/local.key
  certificates:
    - certFile: /etc/traefik/certificados/cadeia.crt
      keyFile: /etc/traefik/certificados/local.key
