[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
# Testes e fixtures precisam compartilhar o MESMO event loop: o engine é criado
# uma vez por sessão e suas conexões não podem cruzar loops.
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
